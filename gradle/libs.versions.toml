androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# Glide
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }

# SDP & SSP
sdp-android = { group = "com.intuit.sdp", name = "sdp-android", version.ref = "sdp" }
ssp-android = { group = "com.intuit.ssp", name = "ssp-android", version.ref = "ssp" }

# Ads & Mediation
amazic-library = { group = "com.github.DuongNT3012", name = "AmazicLibrary", version.ref = "amazicLibrary" }
google-play-review = { group = "com.google.android.play", name = "review", version.ref = "playReview" }
