unity-ads = { group = "com.unity3d.ads", name = "unity-ads", version.ref = "unityAds" }
google-ads-mediation-unity = { group = "com.google.ads.mediation", name = "unity", version.ref = "mediationUnity" }
google-ads-mediation-mintegral = { group = "com.google.ads.mediation", name = "mintegral", version.ref = "mediationMintegral" }

# WorkManager
